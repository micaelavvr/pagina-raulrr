  <!-- ======= Cabecera ======= -->
  <header class="hero">
    <h1><span>Catecismo</span></h1>
    <p class="subtitle">Todos los documentos y temas relacionados</p>
  </header>

  <!-- ======= Selector de Papas (chips) ======= -->
  <section class="popes-wrap">
    <h2 class="sr-only">Sumos Pontífices</h2>

    <div class="popes-scroll" id="popesBar">

      <!-- Leon XIV -->
      <button class="pope-chip is-active" data-pope="leon" title="Leon XIV">
        <img src="img/papa.png" alt="Leon XIV">
        <span>Leon XIV</span>
      </button>

      <!-- Francisco -->
      <button class="pope-chip is-active" data-pope="francisco" title="Francisco">
        <img src="img/francisco.png" alt="Francisco">
        <span>Francisco</span>
      </button>

      <!-- Benedicto XVI -->
      <button class="pope-chip" data-pope="benedicto" title="Benedicto XVI">
        <img src="img/benedicto_XVI.png" alt="Benedicto XVI">
        <span>Benedicto XVI</span>
      </button>

      <!-- Juan Pablo II -->
      <button class="pope-chip" data-pope="juanpabloii" title="Juan Pablo II">
        <img src="img/juan-pabloii.png" alt="Juan Pablo II">
        <span>Juan Pablo II</span>
      </button>

      <!-- Juan XXIII -->
      <button class="pope-chip" data-pope="juanxx" title="Juan XXIII">
        <img src="img/juan_XXIII.png" alt="Juan XXIII">
        <span>Juan XXIII</span>
      </button>
    </div>

    <div class="progress-line"></div>
  </section>

  <!-- ======= Tarjetas de encíclicas ======= -->
  <main class="docs-container" id="docsContainer" aria-live="polite" aria-busy="false"></main>

  <!-- ======= Script ======= -->
  <script>
    // Menú desplegable del header
    document.querySelectorAll('[data-dd]').forEach(dd => {
      const trigger = dd.querySelector('.dd-trigger');
      const menu = dd.querySelector('.dd-menu');
      const setOpen = on => { dd.classList.toggle('open', on); menu.hidden = !on; trigger.setAttribute('aria-expanded', on ? 'true' : 'false'); };
      trigger.addEventListener('click', e => { e.stopPropagation(); setOpen(!dd.classList.contains('open')); });
      menu.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', e => { if (!dd.contains(e.target)) setOpen(false); });
    });

    // Avatares por papa (imagen grande decorativa)
    const POPE_AVATAR = {
      leon: "img/papa.png",
      francisco: "img/francisco.png",
      benedicto: "img/benedicto_XVI.png",
      juanpabloii: "img/juan-pabloii.png",
      juanxx: "img/juan_XXIII.png"
    };

    const POPE_NAME = {
      leon: "Leon XIV",
      francisco: "Francisco",
      benedicto: "Benedicto XVI",
      juanpabloii: "Juan Pablo II",
      juanxx: "Juan XXIII"
    };

    // === Encíclicas por Papa ===
    const ENCICLICAS = {

      leon: [
        { titulo: "Dilexi te (09 de octubre de 2025)", file: "docs/catecismo/leon/Dilexi te del Santo Padre Leon XIV sobre el amor a los pobres.pdf" },
        { titulo: "Diseñar nuevos mapas de esperanza (27 de octubre de 2025)", file: "docs/catecismo/leon/DISENAR NUEVOS MAPAS DE ESPERANZA.pdf" },
        { titulo: "In unitate fidei (23 de noviembre de 2025)", file: "docs/catecismo/leon/IN UNITATE FIDEI.pdf" }

      ],

      francisco: [
        { titulo: "Dilexit nos (24 de octubre de 2024)", file: "docs/catecismo/20241024-enciclica-dilexit-nos.pdf" },
        { titulo: "Fratelli tutti (3 de octubre de 2020)", file: "docs/catecismo/papa-francesco_20201003_enciclica-fratelli-tutti.pdf" },
        { titulo: "Laudato si' (24 de mayo de 2015)", file: "docs/catecismo/papa-francesco_20150524_enciclica-laudato-si_sp.pdf" },
        { titulo: "Lumen Fidei (29 de junio de 2013)", file: "docs/catecismo/papa-francesco_20130629_enciclica-lumen-fidei_sp.pdf" }
      ],

      benedicto: [
        { titulo: "Deus caritas est (25 de diciembre de 2005)", file: "docs/catecismo/deus_caritas_est.pdf" },
        { titulo: "Spe salvi (30 de noviembre de 2007)", file: "docs/catecismo/spe_salvi.pdf" },
        { titulo: "Caritas in veritate (29 de junio de 2009)", file: "docs/catecismo/caritas_in_veritate.pdf" }
      ],

      // --- Juan Pablo II (docs/catecismo/juanpabloii/*.pdf) ---
      juanpabloii: [
        { titulo: "Centesimus Annus (1 de mayo de 1991)", file: "docs/catecismo/juanpabloii/Centesimus Annus (1 de mayo de 1991).pdf" },
        { titulo: "Dives in Misericordia (30 de noviembre de 1980)", file: "docs/catecismo/juanpabloii/Dives in Misericordia (30 de noviembre de 1980).pdf" },
        { titulo: "Dominum et Vivificantem (18 de mayo de 1986)", file: "docs/catecismo/juanpabloii/Dominum et Vivificantem (18 de mayo de 1986).pdf" },
        { titulo: "Ecclesia de Eucharistia (17 de abril de 2003)", file: "docs/catecismo/juanpabloii/Ecclesia de Eucharistia (17 de abril de 2003).pdf" },
        { titulo: "Evangelium Vitae (25 de marzo de 1995)", file: "docs/catecismo/juanpabloii/Evangelium Vitae (25 de marzo de 1995).pdf" },
        { titulo: "Fides et Ratio (14 de septiembre de 1998)", file: "docs/catecismo/juanpabloii/Fides et Ratio (14 de septiembre de 1998).pdf" },
        { titulo: "Laborem Exercens (14 de septiembre de 1981)", file: "docs/catecismo/juanpabloii/Laborem Exercens (14 de septiembre de 1981).pdf" },
        { titulo: "Redemptor Hominis (4 de marzo de 1979)", file: "docs/catecismo/juanpabloii/Redemptor hominis (4 de marzo de 1979).pdf" },
        { titulo: "Redemptoris Missio (7 de diciembre de 1990)", file: "docs/catecismo/juanpabloii/Redemptoris Missio (7 de diciembre de 1990).pdf" },
        { titulo: "Slavorum Apostoli (2 de junio de 1985)", file: "docs/catecismo/juanpabloii/Slavorum Apostoli (2 de junio de 1985).pdf" },
        { titulo: "Sollicitudo Rei Socialis (30 de diciembre de 1987)", file: "docs/catecismo/juanpabloii/Sollicitudo Rei Socialis (30 de diciembre de 1987).pdf" },
        { titulo: "Ut Unum Sint (25 de mayo de 1995)", file: "docs/catecismo/juanpabloii/Ut Unum Sint (25 de mayo de 1995).pdf" },
        { titulo: "Veritatis Splendor (6 de agosto de 1993)", file: "docs/catecismo/juanpabloii/Veritatis Splendor (6 de agosto de 1993).pdf" }
      ],

      // --- Juan XXIII (docs/catecismo/juanxx/*.pdf) ---
      juanxx: [
        { titulo: "Ad Petri Cathedram (29 de junio de 1959)", file: "docs/catecismo/juanxx/Ad Petri Cathedram (29 de junio de 1959).pdf" },
        { titulo: "Aeterna Dei Sapientia (11 de noviembre de 1961)", file: "docs/catecismo/juanxx/Aeterna Dei Sapientia (11 de noviembre de 1961).pdf" },
        { titulo: "Grata Recordatio (26 de septiembre de 1959)", file: "docs/catecismo/juanxx/Grata Recordatio (26 de septiembre de 1959).pdf" },
        { titulo: "Mater et Magistra (15 de mayo de 1961)", file: "docs/catecismo/juanxx/Mater et Magistra (15 de mayo de 1961).pdf" },
        { titulo: "Pacem in terris (11 de abril de 1963)", file: "docs/catecismo/juanxx/Pacem in terris (11 de abril de 1963).pdf" },
        { titulo: "Paenitentiam Agere (1 de julio de 1962)", file: "docs/catecismo/juanxx/Paenitentiam Agere (1 de julio de 1962).pdf" },
        { titulo: "Princeps Pastorum (28 de noviembre de 1959)", file: "docs/catecismo/juanxx/Princeps Pastorum (28 de noviembre de 1959).pdf" }
      ]
    };

    // Render de tarjetas
    const docsContainer = document.getElementById('docsContainer');

    function renderDocs(popeKey) {
      const lista = ENCICLICAS[popeKey] || [];
      docsContainer.innerHTML = '';
      docsContainer.setAttribute('aria-busy', 'true');

      // Avatar grande del papa (decorativo)
      const avatar = document.createElement('div');
      avatar.className = 'pope-hero';
      const src = POPE_AVATAR[popeKey] || 'img/logo-vatican.png';
      const alt = POPE_NAME[popeKey] || popeKey;
      avatar.innerHTML = `<img src="${src}" alt="${alt}" />`;
      docsContainer.appendChild(avatar);

      if (!lista.length) {
        docsContainer.innerHTML += `
          <div class="empty">
            <p>Aún no hemos añadido encíclicas para este pontífice.</p>
          </div>`;
        docsContainer.setAttribute('aria-busy', 'false');
        return;
      }

      // Grid de tarjetas
      const grid = document.createElement('section');
      grid.className = 'cards-grid';

      lista.forEach(doc => {
        const card = document.createElement('a');
        card.className = 'doc-card';
        card.href = doc.file;
        card.target = '_blank';
        card.rel = 'noopener';
        card.innerHTML = `
          <div class="doc-icon">
            <img src="img/logo-vatican.png" alt="Logo Vaticano">
          </div>
          <div class="doc-meta">
            <h3>${doc.titulo}</h3>
            <small>${decodeURIComponent(doc.file).split('/').pop()}</small>
          </div>`;
        grid.appendChild(card);
      });

      docsContainer.appendChild(grid);
      docsContainer.setAttribute('aria-busy', 'false');
    }

    // Inicial
    renderDocs('leon');

    // Cambio de papa
    document.getElementById('popesBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.pope-chip');
      if (!btn) return;
      document.querySelectorAll('.pope-chip').forEach(b => b.classList.remove('is-active'));
      btn.classList.add('is-active');
      renderDocs(btn.dataset.pope);
    });
  </script>

  <script>
    // Dropdown accesible (déjalo una sola vez por página)
    document.querySelectorAll('[data-dd]').forEach(dd => {
      const btn = dd.querySelector('.dd-trigger');
      const menu = dd.querySelector('.dd-menu');
      const setOpen = on => {
        dd.classList.toggle('open', on);
        menu.hidden = !on;
        btn.setAttribute('aria-expanded', on ? 'true' : 'false');
      };
      btn.addEventListener('click', e => { e.stopPropagation(); setOpen(!dd.classList.contains('open')); });
      menu.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', e => { if (!dd.contains(e.target)) setOpen(false); });
    });
  </script>


</body>
